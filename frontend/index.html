<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Parkventory permet aux collègues de partager et réserver les places de parking disponibles dans leur entreprise."
    />
    <meta name="theme-color" content="#030504" />
    <script>
      (() => {
        const storageKey = "parkventory:ui-theme:v1";
        let theme = "dark";
        try {
          const storedTheme = window.localStorage.getItem(storageKey);
          if (storedTheme === "light" || storedTheme === "dark") theme = storedTheme;
        } catch {
          // Keep the dark default when storage is unavailable.
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          "content",
          theme === "light" ? "#f4f6f1" : "#030504",
        );
      })();
    </script>
    <link rel="icon" href="%BASE_URL%parkventory-logo-transparent.svg" type="image/svg+xml" />
    <title>Parkventory — Le parking partagé, simplement</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
