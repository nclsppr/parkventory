quarkus.application.name=parkventory-backend
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://127.0.0.1:5173
quarkus.http.cors.methods=GET,POST,DELETE,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type,Idempotency-Key
quarkus.http.cors.access-control-allow-credentials=true
%prod.quarkus.http.cors.enabled=false

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${PARKVENTORY_DB_USER:parkventory}
quarkus.datasource.password=${PARKVENTORY_DB_PASSWORD:parkventory-local-only}
%dev.quarkus.datasource.jdbc.url=${PARKVENTORY_JDBC_URL:jdbc:postgresql://localhost:5434/parkventory}
%prod.quarkus.datasource.jdbc.url=${PARKVENTORY_JDBC_URL:jdbc:postgresql://localhost:5434/parkventory}
quarkus.flyway.migrate-at-start=true
%prod.quarkus.flyway.migrate-at-start=false
quarkus.flyway.validate-on-migrate=true
quarkus.hibernate-orm.schema-management.strategy=none

%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=${PARKVENTORY_TEST_POSTGRES_IMAGE:docker.io/library/postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7}
%test.parkventory.test.expected-postgres-version=${PARKVENTORY_TEST_POSTGRES_VERSION:18.3}
%test.quarkus.http.test-port=0

# Local development keeps the Mailpit magic-link adapter. The OIDC beans and
# routes are compiled only in the production build profile.
%dev.quarkus.oidc.tenant-enabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.keycloak.devservices.enabled=false

# Production identity is an Auth0-compatible confidential web application.
# Every ${...} expression below is intentionally required: a production process
# without an exact issuer, client identity, or cryptographic secret must fail.
%dev.quarkus.http.auth.proactive=false
%test.quarkus.http.auth.proactive=false
%prod.quarkus.http.auth.proactive=false
%prod.quarkus.oidc.tenant-enabled=true
%prod.quarkus.oidc.application-type=web-app
%prod.quarkus.oidc.auth-server-url=${PARKVENTORY_OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc.discovery-enabled=false
%prod.quarkus.oidc.authorization-path=/authorize
%prod.quarkus.oidc.token-path=/oauth/token
%prod.quarkus.oidc.jwks-path=/.well-known/jwks.json
%prod.quarkus.oidc.jwks.resolve-early=false
%prod.quarkus.oidc.client-id=${PARKVENTORY_OIDC_CLIENT_ID}
%prod.quarkus.oidc.credentials.secret=${PARKVENTORY_OIDC_CLIENT_SECRET}
%prod.quarkus.oidc.authentication.redirect-path=/api/v1/auth/oidc/callback
%prod.quarkus.oidc.authentication.restore-path-after-redirect=true
%prod.quarkus.oidc.authentication.remove-redirect-parameters=true
%prod.quarkus.oidc.authentication.scopes=email,profile
%prod.quarkus.oidc.authentication.extra-params.connection=email
%prod.quarkus.oidc.authentication.extra-params.prompt=login
%prod.quarkus.oidc.authentication.nonce-required=true
%prod.quarkus.oidc.authentication.pkce-required=true
%prod.quarkus.oidc.authentication.state-secret=${PARKVENTORY_OIDC_STATE_SECRET}
%prod.quarkus.oidc.authentication.state-cookie-age=5M
%prod.quarkus.oidc.authentication.fail-on-missing-state-param=true
%prod.quarkus.oidc.authentication.allow-multiple-code-flows=false
%prod.quarkus.oidc.authentication.force-redirect-https-scheme=true
%prod.quarkus.oidc.authentication.cookie-force-secure=true
%prod.quarkus.oidc.authentication.cookie-same-site=lax
%prod.quarkus.oidc.authentication.state-cookie-same-site=lax
%prod.quarkus.oidc.authentication.cache-control=no-store
%prod.quarkus.oidc.token.issuer=${PARKVENTORY_OIDC_ISSUER}
%prod.quarkus.oidc.token.audience=${PARKVENTORY_OIDC_CLIENT_ID}
%prod.quarkus.oidc.token.subject-required=true
%prod.quarkus.oidc.token.signature-algorithm=RS256
%prod.quarkus.oidc.token.allow-jwt-introspection=false
%prod.quarkus.oidc.token.allow-opaque-token-introspection=false
%prod.quarkus.oidc.token.refresh-expired=false
%prod.quarkus.oidc.token-state-manager.strategy=id-token
%prod.quarkus.oidc.token-state-manager.encryption-required=true
%prod.quarkus.oidc.token-state-manager.encryption-secret=${PARKVENTORY_OIDC_TOKEN_ENCRYPTION_SECRET}
%prod.parkventory.oidc.expected-issuer=${PARKVENTORY_OIDC_ISSUER}
%prod.quarkus.http.auth.permission.oidc-callback.paths=/api/v1/auth/oidc/callback
%prod.quarkus.http.auth.permission.oidc-callback.policy=authenticated
%prod.quarkus.http.auth.permission.oidc-callback.auth-mechanism=code

quarkus.mailer.from=Parkventory <no-reply@parkventory.local>
quarkus.mailer.host=${PARKVENTORY_SMTP_HOST:127.0.0.1}
quarkus.mailer.port=${PARKVENTORY_SMTP_PORT:1025}
quarkus.mailer.start-tls=DISABLED
quarkus.mailer.tls=false
%dev.quarkus.mailer.mock=false
%prod.quarkus.mailer.mock=false
%test.quarkus.mailer.mock=true
%prod.quarkus.mailer.from=${PARKVENTORY_SMTP_FROM}
%prod.quarkus.mailer.host=${PARKVENTORY_SMTP_HOST}
%prod.quarkus.mailer.port=${PARKVENTORY_SMTP_PORT}
%prod.quarkus.mailer.username=${PARKVENTORY_SMTP_USERNAME}
%prod.quarkus.mailer.password=${PARKVENTORY_SMTP_PASSWORD}
%prod.quarkus.mailer.start-tls=REQUIRED

parkventory.web.base-url=${PARKVENTORY_WEB_BASE_URL:http://127.0.0.1:5173}
parkventory.auth.magic-link-minutes=15
parkventory.auth.session-days=7
parkventory.outbox.poll-interval=1s
parkventory.migration-only=${PARKVENTORY_MIGRATION_ONLY:false}
parkventory.cookie.secure=false
%prod.parkventory.cookie.secure=true

quarkus.smallrye-openapi.info-title=Parkventory API
quarkus.smallrye-openapi.info-version=0.3.0
quarkus.smallrye-openapi.info-description=API locale persistante pour le partage de places de parking entre collègues.
quarkus.swagger-ui.always-include=true
%prod.quarkus.swagger-ui.always-include=false

quarkus.log.category."com.parkventory".level=INFO
quarkus.log.category."quarkus-mailer".level=WARN
