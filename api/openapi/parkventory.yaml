openapi: 3.1.0
info:
  title: Parkventory API
  version: 0.4.3
  description: >-
    Contrat des adaptateurs d’identité exclusifs par profil. Le lien magique et
    Mailpit existent hors production ; Auth0 Universal Login Email OTP existe
    dans le build prod seulement. Les deux établissent une app_session interne.
servers:
  - url: http://127.0.0.1:5173/api/v1
    description: Même origine locale via le proxy Vite
tags:
  - name: Identity
  - name: Dashboard
  - name: Spots
  - name: Sharing
  - name: Reservations
  - name: Invitations
paths:
  /auth/requests:
    x-build-profile: non-prod
    post:
      tags: [Identity]
      operationId: requestMagicLink
      summary: Envoie un lien magique local dans Mailpit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkRequest"
      responses:
        "202":
          description: Demande acceptée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "400":
          description: Adresse absente, invalide ou personnelle
  /auth/verify:
    x-build-profile: non-prod
    post:
      tags: [Identity]
      operationId: verifyMagicLink
      summary: Consomme un lien et ouvre une session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 32, maxLength: 128 }
      responses:
        "200":
          description: Session créée dans un cookie HttpOnly
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "410":
          description: Lien invalide, expiré ou déjà consommé
  /auth/session:
    get:
      tags: [Identity]
      operationId: getSession
      security:
        - cookieSession: []
      responses:
        "200":
          description: Session active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Session absente, expirée ou révoquée
    delete:
      x-build-profile: non-prod
      tags: [Identity]
      operationId: logout
      security:
        - cookieSession: []
      responses:
        "200":
          description: Session révoquée et cookie expiré
  /auth/oidc/login:
    x-build-profile: prod
    get:
      tags: [Identity]
      operationId: startOidcLogin
      summary: Démarre ou termine le code flow Auth0 Email OTP
      description: >-
        Quarkus redirige une session anonyme vers l’issuer exact avec
        connection=email, prompt=login, PKCE S256, state et nonce. Après le
        callback vérifié, la même route provisionne l’adhésion, crée
        l’app_session et redirige vers /app.
      responses:
        "302":
          description: Challenge anonyme redirigé vers Auth0
        "303":
          description: >-
            Session créée puis redirection vers l’application, ou adresse non
            professionnelle redirigée vers une erreur frontend sans exposer l’adresse
        "401":
          description: Claims absents, email non vérifié ou issuer incohérent
        "409":
          description: Identité déjà liée à un autre email vérifié
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/oidc/callback:
    x-build-profile: prod
    get:
      tags: [Identity]
      operationId: completeOidcLogin
      summary: Callback technique géré par Quarkus OIDC
      description: >-
        Route virtuelle réservée au middleware. Le frontend ne lit jamais le
        code, les tokens, le state ou le nonce.
      responses:
        "302":
          description: Code flow validé puis chemin /auth/oidc/login restauré
        "401":
          description: Code flow, state, nonce, issuer, audience ou signature refusé
  /auth/oidc/logout:
    x-build-profile: prod
    post:
      tags: [Identity]
      operationId: logoutOidcSession
      summary: Ferme les sessions locales Parkventory et Quarkus
      description: >-
        Révoque app_session et supprime les cookies locaux. Le cookie Auth0 peut
        rester ; connection=email et prompt=login empêchent une reconnexion
        silencieuse. L'opération reste idempotente si le cookie OIDC local est
        déjà absent ou expiré. Ce n’est pas un logout fournisseur global.
      responses:
        "200":
          description: Session Parkventory fermée et cookies locaux expirés
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      security:
        - cookieSession: []
      responses:
        "200":
          description: Données persistées du membre actif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          description: Authentification requise
  /spots:
    post:
      tags: [Spots]
      operationId: declareAssignedSpot
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpotRequest"
      responses:
        "200":
          description: Affectation créée ou déjà active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Place déjà affectée
        "429":
          $ref: "#/components/responses/RateLimited"
  /shares:
    post:
      tags: [Sharing]
      operationId: shareSpot
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareRequest"
      responses:
        "200":
          description: Disponibilité persistée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "400":
          description: Créneau invalide
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Affectation absente, offre chevauchante ou limite de partages actifs atteinte
        "429":
          $ref: "#/components/responses/RateLimited"
  /availability/{availabilityId}/reservations:
    post:
      tags: [Reservations]
      operationId: reserveSpot
      security:
        - cookieSession: []
      parameters:
        - name: availabilityId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200":
          description: Réservation confirmée ou résultat idempotent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "400":
          description: Clé d’idempotence invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Disponibilité inconnue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: Disponibilité prise, expirée ou appartenant au membre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /reservations/{reservationId}:
    delete:
      tags: [Reservations]
      operationId: cancelReservation
      summary: Annule une réservation confirmée avant son début
      description: >-
        L’annulation est idempotente, conserve l’historique, libère le créneau
        et place la notification du titulaire dans l’outbox de la même
        transaction.
      security:
        - cookieSession: []
      parameters:
        - name: reservationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Réservation annulée ou déjà annulée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Réservation inconnue dans le tenant actif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: Réservation commencée ou dans un état non annulable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /availability/{availabilityId}:
    delete:
      tags: [Sharing]
      operationId: withdrawAvailability
      summary: Retire une disponibilité sans réservation active
      description: >-
        Le retrait est idempotent et historisé. Une réservation active bloque
        l’action afin qu’elle ne soit jamais supprimée silencieusement.
      security:
        - cookieSession: []
      parameters:
        - name: availabilityId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Disponibilité retirée ou déjà retirée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Disponibilité inconnue dans le tenant actif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: Réservation active ou disponibilité non retirable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /invitations:
    post:
      tags: [Invitations]
      operationId: inviteColleague
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationRequest"
      responses:
        "200":
          description: Invitation persistée et email placé dans l’outbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "400":
          description: Adresse absente, invalide, personnelle ou identique
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  responses:
    Unauthorized:
      description: Session absente, expirée ou révoquée
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    Forbidden:
      description: >-
        Origine ou contexte de navigation refusé par le filtre de production,
        ou action interdite au membre authentifié
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    RateLimited:
      description: Trop de requêtes ; le client doit attendre avant de réessayer
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    ServerError:
      description: Erreur interne sans détail sensible
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: parkventory_session
  schemas:
    MagicLinkRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    Session:
      type: object
      required: [authenticated, displayName, email, organizationName, role]
      properties:
        authenticated: { type: boolean, const: true }
        displayName: { type: string }
        email: { type: string, format: email }
        organizationName: { type: string }
        role: { type: string, enum: [MEMBER, ADMIN] }
    Dashboard:
      type: object
      required: [demo, user, organization, stats, availability, activeShares, thanks]
      properties:
        demo:
          type: boolean
          const: false
        user:
          $ref: "#/components/schemas/User"
        organization:
          $ref: "#/components/schemas/Organization"
        stats:
          $ref: "#/components/schemas/Stats"
        availability:
          type: array
          maxItems: 50
          description: Créneaux publiés dans les sept prochains jours, bornés pour la recherche
          items:
            $ref: "#/components/schemas/Availability"
        activeShares:
          type: array
          maxItems: 366
          description: Partages futurs encore publiés par le membre courant, plafonnés transactionnellement à 366
          items:
            $ref: "#/components/schemas/Availability"
        thanks:
          type: array
          items:
            $ref: "#/components/schemas/Thanks"
    User:
      type: object
      required:
        - firstName
        - fullName
        - initials
        - assignedSpot
        - assignedLevel
        - assignedSiteTimeZone
      properties:
        firstName: { type: string }
        fullName: { type: string }
        initials: { type: string }
        assignedSpot: { type: [string, "null"] }
        assignedLevel: { type: [string, "null"] }
        assignedSiteTimeZone:
          type: [string, "null"]
          description: Fuseau IANA du site de la place affectée, ou null sans affectation
          example: Europe/Paris
    Organization:
      type: object
      required: [name, sharedTotal]
      properties:
        name: { type: string }
        sharedTotal: { type: integer, minimum: 0 }
    Stats:
      type: object
      required: [shares, reservations, availableSpots]
      properties:
        shares: { type: integer, minimum: 0 }
        reservations: { type: integer, minimum: 0 }
        availableSpots: { type: integer, minimum: 0 }
    Availability:
      type: object
      required:
        - id
        - dateLabel
        - timeLabel
        - timeZone
        - spot
        - level
        - status
        - viewerRelation
        - reservationId
        - canCancel
        - canWithdraw
      properties:
        id: { type: string, format: uuid }
        dateLabel: { type: string }
        timeLabel: { type: string }
        timeZone:
          type: string
          description: Fuseau IANA du parking auquel appartient cette disponibilité
          example: Europe/Paris
        spot: { type: string }
        level: { type: string }
        status:
          type: string
          enum: [AVAILABLE, RESERVED, UNAVAILABLE]
        viewerRelation:
          type: string
          enum: [NONE, OFFERED, RESERVED]
        reservationId: { type: [string, "null"], format: uuid }
        canCancel: { type: boolean }
        canWithdraw: { type: boolean }
    Thanks:
      type: object
      required: [id, initials, author, message, when]
      properties:
        id: { type: string }
        initials: { type: string }
        author: { type: string }
        message: { type: string }
        when: { type: string }
    SpotRequest:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 32 }
        level: { type: [string, "null"], maxLength: 64 }
    ShareRequest:
      type: object
      required: [spot, date, from, to]
      properties:
        spot: { type: string, minLength: 1, maxLength: 32 }
        date: { type: string, format: date }
        from: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }
        to: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }
    InvitationRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ActionResponse:
      type: object
      required: [accepted, message]
      properties:
        accepted: { type: boolean }
        message: { type: string }
    ApiProblem:
      type: object
      required: [status, detail]
      properties:
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
