name: parkventory

services:
  postgres:
    image: postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    environment:
      POSTGRES_DB: ${PARKVENTORY_DB_NAME:-parkventory}
      POSTGRES_USER: ${PARKVENTORY_DB_USER:-parkventory}
      POSTGRES_PASSWORD: ${PARKVENTORY_DB_PASSWORD:-parkventory-local-only}
    ports:
      - "${PARKVENTORY_DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PARKVENTORY_DB_USER:-parkventory} -d ${PARKVENTORY_DB_NAME:-parkventory}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - parkventory-postgres:/var/lib/postgresql
    restart: unless-stopped

volumes:
  parkventory-postgres:
