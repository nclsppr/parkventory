name: parkventory

services:
  postgres:
    image: postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    environment:
      POSTGRES_DB: ${PARKVENTORY_DB_NAME:-parkventory}
      POSTGRES_USER: ${PARKVENTORY_DB_USER:-parkventory}
      POSTGRES_PASSWORD: ${PARKVENTORY_DB_PASSWORD:-parkventory-local-only}
    ports:
      - "${PARKVENTORY_DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PARKVENTORY_DB_USER:-parkventory} -d ${PARKVENTORY_DB_NAME:-parkventory}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - parkventory-postgres:/var/lib/postgresql
    labels:
      foundation.lifecycle: service

  mailpit:
    image: axllent/mailpit:v1.30.6@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
      MP_MAX_AGE: 7d
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - "${PARKVENTORY_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${PARKVENTORY_MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    volumes:
      - parkventory-mailpit:/data
    labels:
      foundation.lifecycle: service

  backend:
    image: maven:3.9.16-eclipse-temurin-25@sha256:7e461cec477077c1d9e50b13df8aef9018764410f4c4cd7c34803f10c4c99e4c
    working_dir: /workspace/backend
    command:
      - mvn
      - quarkus:dev
      - -Dquarkus.analytics.disabled=true
      - -Dquarkus.http.host=0.0.0.0
    environment:
      PARKVENTORY_DB_USER: ${PARKVENTORY_DB_USER:-parkventory}
      PARKVENTORY_DB_PASSWORD: ${PARKVENTORY_DB_PASSWORD:-parkventory-local-only}
      PARKVENTORY_JDBC_URL: jdbc:postgresql://postgres:5432/${PARKVENTORY_DB_NAME:-parkventory}
      PARKVENTORY_SMTP_HOST: mailpit
      PARKVENTORY_SMTP_PORT: 1025
      PARKVENTORY_WEB_BASE_URL: http://127.0.0.1:${PARKVENTORY_WEB_PORT:-5173}
    ports:
      - "${PARKVENTORY_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /q/health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"' <&3
      interval: 5s
      timeout: 4s
      retries: 36
      start_period: 60s
    volumes:
      - type: bind
        source: ./backend
        target: /workspace/backend
      - type: volume
        source: parkventory-maven-cache
        target: /root/.m2
      - type: volume
        source: parkventory-backend-target
        target: /workspace/backend/target
    init: true
    stop_grace_period: 15s
    labels:
      foundation.lifecycle: service

  frontend:
    image: node:24.18.0-bookworm-slim@sha256:6f7b03f7c2c8e2e784dcf9295400527b9b1270fd37b7e9a7285cf83b6951452d
    working_dir: /workspace
    command:
      - sh
      - -ec
      - npm ci --ignore-scripts --no-audit --no-fund && npm run dev:frontend
    environment:
      VITE_DEV_API_PROXY: http://backend:8080
    ports:
      - "${PARKVENTORY_WEB_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173/').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 4s
      retries: 48
      start_period: 60s
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: volume
        source: parkventory-node-modules
        target: /workspace/node_modules
      - type: volume
        source: parkventory-frontend-node-modules
        target: /workspace/frontend/node_modules
    init: true
    stop_grace_period: 10s
    labels:
      foundation.lifecycle: service

volumes:
  parkventory-postgres:
  parkventory-mailpit:
  parkventory-maven-cache:
  parkventory-backend-target:
  parkventory-node-modules:
  parkventory-frontend-node-modules:
