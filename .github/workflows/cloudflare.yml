name: Cloudflare candidate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Node runtime
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.13
          cache: true

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify Worker, D1 and React
        run: npm run verify

  required-context-compatibility:
    name: Validate application release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Confirm the Cloudflare candidate gate
        run: test "${{ needs.verify.result }}" = "success"
