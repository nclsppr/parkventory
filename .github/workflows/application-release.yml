name: Application release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-release-${{ github.ref }}
  cancel-in-progress: true

env:
  ORAS_IMAGE: ghcr.io/oras-project/oras:v1.3.0@sha256:6ce045ce069a89934d6666b8b49f9c4c0145201bd6de6dbe2aee267814c55468
  TRIVY_VERSION: v0.72.0

jobs:
  validate:
    name: Validate application release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a checkout different from the event revision
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Install pinned runtimes
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.13
          cache: true

      - name: Run the canonical repository gate
        run: ./scripts/verify.sh

      - name: Load locked production image inputs
        shell: bash
        run: grep -E '^[A-Z][A-Z0-9_]*=' config/deployment/images.env >>"${GITHUB_ENV}"

      - name: Configure Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the backend candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/images/backend.Dockerfile
          build-args: |
            MAVEN_IMAGE=${{ env.MAVEN_IMAGE }}
            TEMURIN_RUNTIME_IMAGE=${{ env.TEMURIN_RUNTIME_IMAGE }}
          load: true
          platforms: linux/amd64
          pull: true
          tags: parkventory-ci/backend:${{ github.sha }}
          cache-from: type=gha,scope=parkventory-backend-production
          cache-to: type=gha,mode=max,scope=parkventory-backend-production

      - name: Scan the backend candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: parkventory-ci/backend:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build the frontend candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/images/frontend.Dockerfile
          build-args: |
            NODE_IMAGE=${{ env.NODE_IMAGE }}
            NGINX_IMAGE=${{ env.NGINX_IMAGE }}
          load: true
          platforms: linux/amd64
          pull: true
          tags: parkventory-ci/frontend:${{ github.sha }}
          cache-from: type=gha,scope=parkventory-frontend-production
          cache-to: type=gha,mode=max,scope=parkventory-frontend-production

      - name: Scan the frontend candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: parkventory-ci/frontend:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Exercise the exact image candidates
        env:
          PARKVENTORY_BACKEND_TEST_IMAGE: parkventory-ci/backend:${{ github.sha }}
          PARKVENTORY_FRONTEND_TEST_IMAGE: parkventory-ci/frontend:${{ github.sha }}
          PARKVENTORY_SKIP_IMAGE_BUILD: "true"
        run: ./scripts/test-production-images.sh

  publish_backend:
    name: Publish backend image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      reference: ${{ steps.reference.outputs.value }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse a checkout different from the event revision
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Load locked production image inputs
        shell: bash
        run: grep -E '^[A-Z][A-Z0-9_]*=' config/deployment/images.env >>"${GITHUB_ENV}"

      - name: Configure Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the immutable backend image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/images/backend.Dockerfile
          build-args: |
            MAVEN_IMAGE=${{ env.MAVEN_IMAGE }}
            TEMURIN_RUNTIME_IMAGE=${{ env.TEMURIN_RUNTIME_IMAGE }}
          platforms: linux/amd64
          pull: true
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=parkventory-backend-production
          cache-to: type=gha,mode=max,scope=parkventory-backend-production

      - name: Scan the pushed backend digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}/backend@${{ steps.push.outputs.digest }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Attest the backend digest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ghcr.io/${{ github.repository }}/backend
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify backend provenance policy
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify "oci://ghcr.io/${GITHUB_REPOSITORY}/backend@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/application-release.yml" \
            --source-ref refs/heads/main \
            --source-digest "${GITHUB_SHA}" \
            --deny-self-hosted-runners

      - name: Export the immutable backend reference
        id: reference
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY}/backend@${DIGEST}" >>"${GITHUB_OUTPUT}"

  publish_frontend:
    name: Publish frontend image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      reference: ${{ steps.reference.outputs.value }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse a checkout different from the event revision
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Load locked production image inputs
        shell: bash
        run: grep -E '^[A-Z][A-Z0-9_]*=' config/deployment/images.env >>"${GITHUB_ENV}"

      - name: Configure Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the immutable frontend image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/images/frontend.Dockerfile
          build-args: |
            NODE_IMAGE=${{ env.NODE_IMAGE }}
            NGINX_IMAGE=${{ env.NGINX_IMAGE }}
          platforms: linux/amd64
          pull: true
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=parkventory-frontend-production
          cache-to: type=gha,mode=max,scope=parkventory-frontend-production

      - name: Scan the pushed frontend digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}/frontend@${{ steps.push.outputs.digest }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Attest the frontend digest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ghcr.io/${{ github.repository }}/frontend
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify frontend provenance policy
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify "oci://ghcr.io/${GITHUB_REPOSITORY}/frontend@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/application-release.yml" \
            --source-ref refs/heads/main \
            --source-digest "${GITHUB_SHA}" \
            --deny-self-hosted-runners

      - name: Export the immutable frontend reference
        id: reference
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY}/frontend@${DIGEST}" >>"${GITHUB_OUTPUT}"

  publish_integration:
    name: Publish VPS integration artifact
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      migrations_sha256: ${{ steps.publish.outputs.migrations_sha256 }}
      probes_sha256: ${{ steps.publish.outputs.probes_sha256 }}
      reference: ${{ steps.publish.outputs.reference }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a checkout different from the event revision
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Build the integration bundle twice
        run: |
          ./scripts/build-vps-integration.sh "${RUNNER_TEMP}/integration-a" "${GITHUB_SHA}"
          ./scripts/build-vps-integration.sh "${RUNNER_TEMP}/integration-b" "${GITHUB_SHA}"
          cmp "${RUNNER_TEMP}/integration-a/integration.tar.gz" \
            "${RUNNER_TEMP}/integration-b/integration.tar.gz"
          cmp "${RUNNER_TEMP}/integration-a/inventory.json" \
            "${RUNNER_TEMP}/integration-b/inventory.json"

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the immutable integration bundle
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY}/vps-integration"
          tag="sha-${GITHUB_SHA}"
          created_at=$(git show -s --format=%cI "${GITHUB_SHA}")
          result=$(docker run --rm \
            --volume "${HOME}/.docker:/root/.docker:ro" \
            --volume "${RUNNER_TEMP}/integration-a:/workspace:ro" \
            --workdir /workspace \
            "${ORAS_IMAGE}" push \
            --artifact-type application/vnd.vps-infra.application-integration.v1 \
            --annotation "org.opencontainers.image.created=${created_at}" \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --format json \
            "${repository}:${tag}" \
            integration.tar.gz:application/vnd.vps-infra.application-integration.v1+tar+gzip \
            inventory.json:application/vnd.vps-infra.application-integration.inventory.v1+json)
          digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"${result}")
          migrations_sha256=$(jq -er \
            '.files[] | select(.path == "migrations.json") | "sha256:" + .sha256' \
            "${RUNNER_TEMP}/integration-a/inventory.json")
          probes_sha256=$(jq -er \
            '.files[] | select(.path == "probes.json") | "sha256:" + .sha256' \
            "${RUNNER_TEMP}/integration-a/inventory.json")
          {
            echo "digest=${digest}"
            echo "migrations_sha256=${migrations_sha256}"
            echo "probes_sha256=${probes_sha256}"
            echo "reference=${repository}@${digest}"
            echo "repository=${repository}"
          } >>"${GITHUB_OUTPUT}"

      - name: Pull back and compare the integration layers
        env:
          REFERENCE: ${{ steps.publish.outputs.reference }}
        run: |
          mkdir "${RUNNER_TEMP}/integration-pulled"
          docker run --rm \
            --volume "${HOME}/.docker:/root/.docker:ro" \
            --volume "${RUNNER_TEMP}/integration-pulled:/pulled" \
            "${ORAS_IMAGE}" pull --output /pulled "${REFERENCE}"
          cmp "${RUNNER_TEMP}/integration-a/integration.tar.gz" \
            "${RUNNER_TEMP}/integration-pulled/integration.tar.gz"
          cmp "${RUNNER_TEMP}/integration-a/inventory.json" \
            "${RUNNER_TEMP}/integration-pulled/inventory.json"

      - name: Attest the integration digest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.publish.outputs.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Verify integration provenance policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFERENCE: ${{ steps.publish.outputs.reference }}
        run: |
          gh attestation verify "oci://${REFERENCE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/application-release.yml" \
            --source-ref refs/heads/main \
            --source-digest "${GITHUB_SHA}" \
            --deny-self-hosted-runners

  verify_pushed_images:
    name: Verify the exact pushed image digests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - publish_backend
      - publish_frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse a checkout different from the event revision
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the exact pushed image digests
        env:
          BACKEND_REF: ${{ needs.publish_backend.outputs.reference }}
          FRONTEND_REF: ${{ needs.publish_frontend.outputs.reference }}
        run: |
          docker pull --platform linux/amd64 "${BACKEND_REF}"
          docker pull --platform linux/amd64 "${FRONTEND_REF}"

      - name: Verify architecture, labels, users, health, migrator and runtime role
        env:
          PARKVENTORY_BACKEND_TEST_IMAGE: ${{ needs.publish_backend.outputs.reference }}
          PARKVENTORY_EXPECT_IMAGE_REVISION: ${{ github.sha }}
          PARKVENTORY_EXPECT_IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          PARKVENTORY_FRONTEND_TEST_IMAGE: ${{ needs.publish_frontend.outputs.reference }}
          PARKVENTORY_SKIP_IMAGE_BUILD: "true"
        run: ./scripts/test-production-images.sh

  publish_release:
    name: Publish immutable application release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - publish_backend
      - publish_frontend
      - publish_integration
      - validate
      - verify_pushed_images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a checkout different from the event revision
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Build the canonical release descriptor twice
        env:
          BACKEND_REF: ${{ needs.publish_backend.outputs.reference }}
          FRONTEND_REF: ${{ needs.publish_frontend.outputs.reference }}
          INTEGRATION_REF: ${{ needs.publish_integration.outputs.reference }}
          MIGRATIONS_SHA256: ${{ needs.publish_integration.outputs.migrations_sha256 }}
          PROBES_SHA256: ${{ needs.publish_integration.outputs.probes_sha256 }}
        run: |
          ./scripts/build-application-release.sh \
            "${RUNNER_TEMP}/release-a" "${GITHUB_SHA}" \
            "${BACKEND_REF}" "${FRONTEND_REF}" "${INTEGRATION_REF}" \
            "${MIGRATIONS_SHA256}" "${PROBES_SHA256}"
          ./scripts/build-application-release.sh \
            "${RUNNER_TEMP}/release-b" "${GITHUB_SHA}" \
            "${BACKEND_REF}" "${FRONTEND_REF}" "${INTEGRATION_REF}" \
            "${MIGRATIONS_SHA256}" "${PROBES_SHA256}"
          cmp "${RUNNER_TEMP}/release-a/application-release.json" \
            "${RUNNER_TEMP}/release-b/application-release.json"
          python3 ./scripts/validate-application-release.py \
            "${RUNNER_TEMP}/release-a/application-release.json" \
            "${GITHUB_SHA}" "${BACKEND_REF}" "${FRONTEND_REF}" \
            "${INTEGRATION_REF}" "${MIGRATIONS_SHA256}" "${PROBES_SHA256}"

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the canonical release descriptor
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY}/application-release"
          tag="sha-${GITHUB_SHA}"
          created_at=$(git show -s --format=%cI "${GITHUB_SHA}")
          result=$(docker run --rm \
            --volume "${HOME}/.docker:/root/.docker:ro" \
            --volume "${RUNNER_TEMP}/release-a:/workspace:ro" \
            --workdir /workspace \
            "${ORAS_IMAGE}" push \
            --artifact-type application/vnd.vps-infra.application-release.v1 \
            --annotation "org.opencontainers.image.created=${created_at}" \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --format json \
            "${repository}:${tag}" \
            application-release.json:application/vnd.vps-infra.application-release.v1+json)
          digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"${result}")
          {
            echo "digest=${digest}"
            echo "reference=${repository}@${digest}"
            echo "repository=${repository}"
          } >>"${GITHUB_OUTPUT}"

      - name: Pull back and compare the release descriptor
        env:
          MANIFEST_DIGEST: ${{ steps.publish.outputs.digest }}
          REFERENCE: ${{ steps.publish.outputs.reference }}
        run: |
          mkdir "${RUNNER_TEMP}/release-pulled"
          docker run --rm \
            --volume "${HOME}/.docker:/root/.docker:ro" \
            --volume "${RUNNER_TEMP}/release-pulled:/pulled" \
            "${ORAS_IMAGE}" pull --output /pulled "${REFERENCE}"
          docker run --rm \
            --volume "${HOME}/.docker:/root/.docker:ro" \
            --volume "${RUNNER_TEMP}/release-pulled:/pulled" \
            "${ORAS_IMAGE}" manifest fetch \
            --output /pulled/manifest.json "${REFERENCE}"
          cmp "${RUNNER_TEMP}/release-a/application-release.json" \
            "${RUNNER_TEMP}/release-pulled/application-release.json"
          python3 ./scripts/validate-application-release.py \
            "${RUNNER_TEMP}/release-pulled/application-release.json" \
            "${GITHUB_SHA}" \
            "${{ needs.publish_backend.outputs.reference }}" \
            "${{ needs.publish_frontend.outputs.reference }}" \
            "${{ needs.publish_integration.outputs.reference }}" \
            "${{ needs.publish_integration.outputs.migrations_sha256 }}" \
            "${{ needs.publish_integration.outputs.probes_sha256 }}"
          created_at=$(git show -s --format=%cI "${GITHUB_SHA}")
          python3 ./scripts/validate-application-release-manifest.py \
            "${RUNNER_TEMP}/release-pulled/manifest.json" \
            "${RUNNER_TEMP}/release-pulled/application-release.json" \
            "${GITHUB_SHA}" "${created_at}" "${MANIFEST_DIGEST}"

      - name: Attest the application release digest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.publish.outputs.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Verify application release provenance policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFERENCE: ${{ steps.publish.outputs.reference }}
        run: |
          gh attestation verify "oci://${REFERENCE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/application-release.yml" \
            --source-ref refs/heads/main \
            --source-digest "${GITHUB_SHA}" \
            --deny-self-hosted-runners

      - name: Upload the raw release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-release-${{ github.sha }}
          path: ${{ runner.temp }}/release-a/application-release.json
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 90

      - name: Record the immutable release
        env:
          REFERENCE: ${{ steps.publish.outputs.reference }}
        run: |
          {
            echo '### Parkventory application release'
            echo
            echo "Source: \`${GITHUB_SHA}\`"
            echo
            echo "Release: \`${REFERENCE}\`"
            echo
            echo 'This publication does not activate or cut over Atlas.'
          } >>"${GITHUB_STEP_SUMMARY}"
